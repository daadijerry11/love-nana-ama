<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nana Ama ❤️</title>

<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Animated gradient background */
        background: linear-gradient(135deg, #ff4d6d, #ff758c, #ffb199, #ffe29f);
        background-size: 400% 400%;
        animation: gradientMove 12s ease infinite;
    }

    @keyframes gradientMove {
        0% {background-position: 0% 50%;}
        50% {background-position: 100% 50%;}
        100% {background-position: 0% 50%;}
    }

    .app {
        width: 320px;
        height: 600px;
        background: rgba(255,255,255,0.9); /* semi-transparent so colors show through */
        border-radius: 30px;
        box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        overflow: hidden;
        position: relative;
    }

    .header {
        background: linear-gradient(to right, #ff4d6d, #ff758c);
        color: white;
        text-align: center;
        padding: 20px;
        font-size: 20px;
        font-weight: bold;
    }

    .content {
        padding: 20px;
        text-align: center;
    }

    .message {
        font-size: 18px;
        margin-bottom: 20px;
    }

    button {
        padding: 12px 20px;
        border: none;
        border-radius: 20px;
        background: linear-gradient(to right, #ff4d6d, #ff758c);
        color: white;
        font-size: 16px;
        margin: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.1);
    }

    .hidden {
        display: none;
    }

    .heart {
        position: absolute;
        color: #ff4d6d;
        animation: float 5s linear infinite;
    }

    @keyframes float {
        0% { transform: translateY(100%); opacity: 1; }
        100% { transform: translateY(-100%); opacity: 0; }
    }

    .footer {
        position: absolute;
        bottom: 10px;
        width: 100%;
        text-align: center;
        font-size: 12px;
        color: gray;
    }
</style>
</head>

<body>

<div class="app">

    <div class="header">
        Nana Ama ❤️
    </div>

    <div class="content">

        <div id="screen1">
            <p class="message">
                I tried to act normal…  
                then I met you 😌💕  
                now I’m permanently distracted.
            </p>
            <button onclick="nextScreen()">Continue 😏</button>
        </div>

        <div id="screen2" class="hidden">
            <p class="message">Do you love me? 🤨</p>
            <button onclick="yesLove()">Yes 😍</button>
            <button id="noBtn" onmouseover="moveBtn()">No 🙄</button>
        </div>

        <div id="screen3" class="hidden">
            <p class="message" id="finalMsg"></p>
        </div>

    </div>

    <div class="footer">
        Made with ❤️ by Jerry
    </div>

</div>

<audio id="song" loop>
    <source src="dandelion.mp3" type="audio/mpeg">
</audio>

<script>
function nextScreen() {
    document.getElementById("screen1").classList.add("hidden");
    document.getElementById("screen2").classList.remove("hidden");
    // Start audio only after user clicks
    const song = document.getElementById("song");
    song.volume = 0; // start silent
    song.play();
    // fade in volume
    let vol = 0;
    const fade = setInterval(() => {
        if (vol < 1) {
            vol += 0.05;
            song.volume = vol;
        } else {
            clearInterval(fade);
        }
    }, 200);
}

function yesLove() {
    document.getElementById("screen2").classList.add("hidden");
    document.getElementById("screen3").classList.remove("hidden");

    document.getElementById("finalMsg").innerHTML =
    "I knew it 😌❤️ You’re my favorite person… don’t let it get to your head 😏🌼";

    startHearts();
}

function moveBtn() {
    const btn = document.getElementById("noBtn");
    btn.style.position = "absolute";
    btn.style.left = Math.random() * 250 + "px";
    btn.style.top = Math.random() * 400 + "px";
}

function startHearts() {
    setInterval(() => {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 300 + "px";
        heart.style.fontSize = Math.random() * 20 + 10 + "px";

        document.querySelector(".app").appendChild(heart);

        setTimeout(() => heart.remove(), 5000);
    }, 300);
}
</script>

</body>
</html>
